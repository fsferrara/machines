# Prefix and native help
set -g prefix C-Space
set -g prefix2 C-b
bind -N "Send primary prefix" C-Space send-prefix
bind -N "Send fallback prefix" C-b send-prefix -2
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display-message "Configuration reloaded"
bind -N "Show keybindings" ? list-keys

# Copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Panes
bind -N "Split top/bottom" h split-window -v -c "#{pane_current_path}"
bind -N "Split left/right" v split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane
bind -n M-Enter split-window -v -c "#{pane_current_path}"
bind -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -n M-Escape kill-pane
bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D
bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Right resize-pane -R 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Down resize-pane -D 5

# Windows
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" k kill-window
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-Left previous-window
bind -n M-Right next-window
bind -n M-S-Left swap-window -t :-1 \; previous-window
bind -n M-S-Right swap-window -t :+1 \; next-window

# Sessions
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n
bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# Trust tmux's terminal detection, not blanket capability overrides.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal tmux-256color' 'set -g default-terminal screen-256color'
set -g set-clipboard external
set -s extended-keys on
if-shell -F '#{>=:#{version},3.3}' 'set -g allow-passthrough on'
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -s escape-time 10
set -s focus-events on
setw -g aggressive-resize on
set -g detach-on-destroy off

# One dark, ANSI-color status style
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'
set -g status-style 'bg=black,fg=white'
set -g status-left '#[fg=black,bg=blue,bold] #S #[default] '
set -g status-right '#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h '
setw -g window-status-separator ''
setw -g window-status-format '#[fg=brightblack] #I:#W '
setw -g window-status-current-format '#[fg=blue,bold] #I:#W '
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=blue'
set -g message-style 'bg=black,fg=blue'
set -g message-command-style 'bg=black,fg=blue'
set -g mode-style 'bg=blue,fg=black'
setw -g clock-mode-colour blue
